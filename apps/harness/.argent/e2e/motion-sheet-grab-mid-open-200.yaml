# Generated by e2e/argent/build.py (motion lab). Edit the run there, then rerun build.py.
steps:
  - launch: com.eds2002.harness
  - tool: open-url
    args:
      url: harness://lab/motion
  - script: { path: ../../e2e/argent/wait-settled.mjs, timeout: 20000 }
  - script: { path: ../../e2e/argent/record-start.mjs }
  # open the sheet, fling it down 200 ms in
  - tool: gesture-custom
    args:
      events:
        - { type: Down, x: 0.125, y: 0.135, delayMs: 0 }
        - { type: Move, x: 0.125, y: 0.135, delayMs: 16 }
        - { type: Move, x: 0.125, y: 0.135, delayMs: 16 }
        - { type: Up, x: 0.125, y: 0.135, delayMs: 16 }
        - { type: Down, x: 0.5, y: 0.9, delayMs: 200.0 }
        - { type: Move, x: 0.5, y: 0.9225, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.945, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.9675, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.99, delayMs: 16 }
        - { type: Up, x: 0.5, y: 0.99, delayMs: 16 }
  - wait: 600
  - script: { path: ../../e2e/argent/wait-settled.mjs, timeout: 20000 }
  - script: { path: ../../e2e/argent/check-motion-sheet-grab-mid-open-200.mjs, timeout: 120000 }
