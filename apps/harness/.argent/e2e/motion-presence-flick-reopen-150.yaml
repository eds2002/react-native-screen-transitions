# Generated by e2e/argent/build.py (motion lab). Edit the run there, then rerun build.py.
steps:
  - launch: com.eds2002.harness
  - tool: open-url
    args:
      url: harness://lab/motion
  - script: { path: ../../e2e/argent/wait-settled.mjs, timeout: 20000 }
  - script: { path: ../../e2e/argent/record-start.mjs }
  - tap: { id: bar-presence-open }
  - script: { path: ../../e2e/argent/wait-settled.mjs, timeout: 20000 }
  - wait: 300
  # fling the presence down, reopen it 150 ms later
  - tool: gesture-custom
    args:
      events:
        - { type: Down, x: 0.5, y: 0.85, delayMs: 0 }
        - { type: Move, x: 0.5, y: 0.8733, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.8967, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.92, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.9433, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.9667, delayMs: 16 }
        - { type: Move, x: 0.5, y: 0.99, delayMs: 16 }
        - { type: Up, x: 0.5, y: 0.99, delayMs: 16 }
        - { type: Down, x: 0.625, y: 0.135, delayMs: 150.0 }
        - { type: Move, x: 0.625, y: 0.135, delayMs: 16 }
        - { type: Move, x: 0.625, y: 0.135, delayMs: 16 }
        - { type: Up, x: 0.625, y: 0.135, delayMs: 16 }
  - wait: 600
  - script: { path: ../../e2e/argent/wait-settled.mjs, timeout: 20000 }
  - script: { path: ../../e2e/argent/check-motion-presence-flick-reopen-150.mjs, timeout: 120000 }
